<header class="style-3 overflow-hidden">
    <div class="container">
        <div class="content section-padding">
            <div class="row">
                <div class="col-lg-5">
                    <div class="info">
                        <h1 class="h1" data-i18n="hero.title">
                            <span>هیوا</span>
                            مدرن بمانید
                        </h1>
                        <p class="p" data-i18n="hero.subtitle">
                            ما با توسعه، پشتیبانی و مشاوره نرم افزار به شما کمک می کنیم
                        </p>
                        <h5 class="h5">
                            <span data-i18n="hero.cta">برای دریافت مشاوره رایگان!</span>
                            <span class="fw-normal ms-1" data-i18n="hero.cta.sub">با ما تماس بگیرید و یا ایمیل ارسال فرمایید</span>
                        </h5>
                        <form id="consultation-form" class="form mt-30" action="https://formsubmit.co/mantera.sh@hotmail.com" method="POST">
                            <input type="hidden" name="_subject" value="درخواست مشاوره جدید از سایت هیوا">
                            <input type="hidden" name="_captcha" value="false">
                            <input type="hidden" name="_template" value="table">
                            <input type="hidden" name="_next" value="thank-you.html">
                            <div class="row gx-3">
                                <div class="col-6">
                                    <div class="form-group input-with-icon">
                                        <input type="email" name="email" class="form-control" data-i18n-placeholder="hero.form.email" placeholder="ایمیل شما *" required>
                                        <span class="input-icon">
                                            <i class="far fa-envelope"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-group">
                                        <select name="intent" class="form-select" required>
                                            <option value="شرکت یا سازمان هستیم" selected data-i18n="hero.form.select.company">شرکت یا سازمان هستیم</option>
                                            <option value="پروژه شخصی میخواهم" data-i18n="hero.form.select.personal">پروژه شخصی میخواهم</option>
                                            <option value="درخواست مشاوره دارم" data-i18n="hero.form.select.consult">درخواست مشاوره دارم</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn dark-butn hover-darkBlue rounded-pill w-100 mt-3">
                                        <span data-i18n="hero.form.submit">ثبت درخواست مشاوره</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main-img">
        <img src="assets/img/header_3.png" alt="" class="pattern">
        <img src="assets/img/header_3_c.png" alt="" class="circle">
        <img src="assets/img/logo.png" alt="" class="logo_shap">
    </div>
</header>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('consultation-form');
        if (!form) return;

        const lang = localStorage.getItem('siteLang') || 'fa';
        const sendingLabel = lang === 'en' ? 'Sending...' : 'در حال ارسال...';
        const successLabel = lang === 'en' ? 'Your message was sent successfully. We will contact you soon.' : 'پیام شما با موفقیت ارسال شد. با شما تماس خواهیم گرفت.';
        const errorLabel = lang === 'en' ? 'Sending failed. Please try again.' : 'ارسال پیام ناموفق بود. لطفاً دوباره تلاش کنید.';

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const button = form.querySelector('button[type="submit"]');
            const originalText = button.innerHTML;
            const statusMessage = document.createElement('div');
            statusMessage.className = 'alert mt-3 mb-0';
            statusMessage.style.borderRadius = '12px';

            button.disabled = true;
            button.innerHTML = sendingLabel;

            const data = Object.fromEntries(new FormData(form).entries());
            const endpoint = form.action.replace('https://formsubmit.co/', 'https://formsubmit.co/ajax/');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Request failed');
                }

                form.reset();
                form.style.display = 'none';
                statusMessage.classList.add('alert-success');
                statusMessage.textContent = successLabel;
                form.insertAdjacentElement('afterend', statusMessage);
            } catch (error) {
                statusMessage.classList.add('alert-danger');
                statusMessage.textContent = errorLabel;
                form.insertAdjacentElement('afterend', statusMessage);
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        });
    });
</script>
