<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>پیام شما ارسال شد</title>
    <link rel="stylesheet" href="assets/css/lib/bootstrap.min.css">
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #f4f7ff 0%, #eaf2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            direction: rtl;
            text-align: center;
            color: #1c2b42;
        }
        .card {
            width: min(90%, 540px);
            border: 0;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(35, 75, 133, 0.12);
            padding: 40px 30px;
            background: #fff;
        }
        .icon {
            font-size: 52px;
            color: #1d7bf2;
            margin-bottom: 18px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 14px;
        }
        p {
            font-size: 1.05rem;
            color: #53627b;
            margin-bottom: 24px;
            line-height: 1.8;
        }
        .btn {
            border-radius: 999px;
            padding: 12px 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>پیام شما با موفقیت ارسال شد</h1>
        <p>از تماس شما سپاسگزاریم. تیم ما در کوتاه‌ترین زمان ممکن با شما تماس خواهد گرفت.</p>
        <a href="index.html" class="btn btn-primary">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
